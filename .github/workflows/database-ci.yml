name: Database CI

on:
  pull_request:
    branches: [dev, qa, main]
  push:
    branches: [dev, qa, main, "HU-**"]

permissions:
  contents: read

jobs:
  compose-validation:
    name: Validate Docker Compose configuration
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Validate Compose with CI-only values
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_for_validation_only
          POSTGRES_DB: ci_database
        run: docker compose --env-file /dev/null -f docker-compose.yml config --quiet
      - name: Reject missing required Compose variables
        env:
          POSTGRES_USER: ci_user
          POSTGRES_DB: ci_database
        run: |
          if docker compose --env-file /dev/null -f docker-compose.yml config --quiet; then
            echo "Compose accepted a missing POSTGRES_PASSWORD variable."
            exit 1
          fi

  liquibase-integration:
    name: Validate Liquibase against PostgreSQL 15
    runs-on: ubuntu-latest
    needs: compose-validation
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ci_user
          POSTGRES_PASSWORD: ci_password_for_integration_only
          POSTGRES_DB: ci_database
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci_user -d ci_database"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out source
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
      - name: Verify PostgreSQL is healthy
        env:
          PGPASSWORD: ci_password_for_integration_only
        run: |
          docker run --rm --network host \
            -e PGPASSWORD \
            postgres:15 \
            psql -h 127.0.0.1 -U ci_user -d ci_database -v ON_ERROR_STOP=1 -c "SELECT 1;"
      - name: Validate Liquibase changelogs
        run: |
          docker run --rm --network host \
            -w /liquibase/changelog \
            -v "$GITHUB_WORKSPACE:/liquibase/changelog:ro" \
            -v "$GITHUB_WORKSPACE/postgresql-42.7.9.jar:/liquibase/lib/postgresql.jar:ro" \
            liquibase/liquibase:4.31.1 \
            --url=jdbc:postgresql://127.0.0.1:5432/ci_database \
            --username=ci_user \
            --password=ci_password_for_integration_only \
            --driver=org.postgresql.Driver \
            --changelog-file=changelog-master.yaml \
            validate
      - name: Apply migrations to isolated PostgreSQL 15
        run: |
          docker run --rm --network host \
            -w /liquibase/changelog \
            -v "$GITHUB_WORKSPACE:/liquibase/changelog:ro" \
            -v "$GITHUB_WORKSPACE/postgresql-42.7.9.jar:/liquibase/lib/postgresql.jar:ro" \
            liquibase/liquibase:4.31.1 \
            --url=jdbc:postgresql://127.0.0.1:5432/ci_database \
            --username=ci_user \
            --password=ci_password_for_integration_only \
            --driver=org.postgresql.Driver \
            --changelog-file=changelog-master.yaml \
            update
      - name: Verify migrated schema and constraints
        env:
          PGPASSWORD: ci_password_for_integration_only
        run: |
          query() {
            docker run --rm --network host -e PGPASSWORD postgres:15 \
              psql -h 127.0.0.1 -U ci_user -d ci_database -tAc "$1"
          }
          for table_name in auth.users auth.permissions auth.user_permissions translation.translations accessibility.accessibility_settings; do
            test "$(query "SELECT to_regclass('$table_name') IS NOT NULL;")" = "t"
          done
          for constraint_name in fk_user_permissions_user fk_user_permissions_permission fk_translations_user fk_accessibility_user; do
            test "$(query "SELECT EXISTS (SELECT 1 FROM pg_constraint WHERE conname = '$constraint_name');")" = "t"
          done
          test "$(query 'SELECT count(*) > 0 FROM databasechangelog;')" = "t"
      - name: Confirm a second Liquibase update is idempotent
        env:
          PGPASSWORD: ci_password_for_integration_only
        run: |
          change_sets_before=$(docker run --rm --network host -e PGPASSWORD postgres:15 \
            psql -h 127.0.0.1 -U ci_user -d ci_database -tAc 'SELECT count(*) FROM databasechangelog;')
          docker run --rm --network host \
            -w /liquibase/changelog \
            -v "$GITHUB_WORKSPACE:/liquibase/changelog:ro" \
            -v "$GITHUB_WORKSPACE/postgresql-42.7.9.jar:/liquibase/lib/postgresql.jar:ro" \
            liquibase/liquibase:4.31.1 \
            --url=jdbc:postgresql://127.0.0.1:5432/ci_database \
            --username=ci_user \
            --password=ci_password_for_integration_only \
            --driver=org.postgresql.Driver \
            --changelog-file=changelog-master.yaml \
            update
          change_sets_after=$(docker run --rm --network host -e PGPASSWORD postgres:15 \
            psql -h 127.0.0.1 -U ci_user -d ci_database -tAc 'SELECT count(*) FROM databasechangelog;')
          test "$change_sets_before" = "$change_sets_after"
